apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: orders
          image: orders:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4000"
            - name: INVENTORY_BASE_URL
              value: "http://inventory.inventory.svc.cluster.local:3000"
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: orders
spec:
  selector: { app: orders }
  ports:
    - name: http
      port: 4000
      targetPort: 4000
