apiVersion: batch/v1
kind: CronJob
metadata:
  name: traffic-keepalive
  namespace: orders
spec:
  schedule: "0 0 * * 1,4"  # Mon + Thu at midnight UTC
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: curl
              image: curlimages/curl
              command:
                - /bin/sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    curl -s -X POST http://orders:4000/v1/orders \
                      -H "Content-Type: application/json" \
                      -d "{\"customerId\":\"c$((RANDOM % 30 + 1))\",\"items\":[{\"sku\":\"SKU-$i\",\"quantity\":1,\"price\":29.99}]}" > /dev/null
                    sleep 5
                  done
          restartPolicy: OnFailure
