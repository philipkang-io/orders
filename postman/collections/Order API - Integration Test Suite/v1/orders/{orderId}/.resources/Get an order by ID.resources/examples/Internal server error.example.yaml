$kind: http-example
request:
  url: "{{baseUrl}}/v1/orders/:orderId"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: orderId
      value: string
      description: Order identifier
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 3000
